# Projects a realm slot can run. Pipe-separated. Notes must not contain pipes.
# Loaded by scripts/select-project.py. catalog.sh stays the realm identity.
#
#  1 id                 selection value and docker/<id> / repos.sh key
#  2 short              realm slot (catalog short, or a display-only classic row)
#  3 label
#  4 repo_key           repos.sh key; empty when the row cannot be built
#  5 kind               alpha | cmangos | azerothcore | trinity | skyfire | none
#                       none is only for an unselectable display-only row
#  6 module_class       azerothcore | cmangos-playerbots | trinity-scripts | vmangos-variant | none
#  7 image              tag without :latest
#  8 client             clients/<client> folder; empty on display-only rows
#  9 expect_build       client build the launch check compares; empty skips it
# 10 auth_bin
# 11 world_bin
# 12 proto              legacy | bnet
# 13 auth_port          container auth port
# 14 world_port         container world port
# 15 rest_port
# 16 db_repo            repos.sh key, or GitHub owner/repo for tdb-github
# 17 db_branch
# 18 db_kind            bundled | cmangos | tdb-github | wod | skyfire | vmangos | mangosthree | none
# 19 selectable         1 or 0
# 20 launch_policy      ok | warn | refuse
# 21 default            1 for the core used when .run/selection.conf is absent
# 22 notes
#
# launch_policy refuse: do not start while the on-disk client build differs.
# warn: print the mismatch and still start. ok: no build gate.
# VMaNGOS and MaNGOS Three use kind cmangos so the site stays on a known account kind.
# Their db_kind is not cmangos, so init does not load classic-db or tbc-db into them.
