# Modules for a project module_class. Pipe-separated. Notes must not contain pipes.
#
# 1 id            checkbox id, or the folder name cloned into an AzerothCore tree
# 2 module_class  must match the project's module_class
# 3 label
# 4 url
# 5 ref           branch the pin was taken from
# 6 commit        40 lowercase hex characters
# 7 requires      another module id that must also be selected; empty if none
# 8 default_on    1 or 0. Curated modules ship off.
# 9 notes
#
# Extra AzerothCore modules are not listed here. The menu accepts name@url@40-hex-commit.
# TrinityCore 3.3.5 script modules are not listed. Their names come from the checkout.
# mod-ollama-chat is intentionally absent.
mod-playerbots|azerothcore|Playerbots|https://github.com/azerothcore/mod-playerbots.git|master|49dfc1fb4a0068a1537571d2dbb29ab0dea3ac53||0|Off by default. The first boot can generate a large number of characters.
mod-ale|azerothcore|Eluna|https://github.com/azerothcore/mod-ale.git|master|84b85cc55980dbf67d596f3d5cb34ded10c59102||0|Lua engine.
mod-transmog|azerothcore|Transmogrification|https://github.com/azerothcore/mod-transmog.git|master|327753a05b9024f2a90738bb08e9b8afc2fc9a21||0|Appearance mirror for items the core already knows.
mod-individual-progression|azerothcore|Individual Progression|https://github.com/ZhengPeiRu21/mod-individual-progression.git|master|4933d455d2f611eed50c74c68c78832df4ed37a3||0|Content gates per character.
mod-autobalance|azerothcore|Autobalance|https://github.com/azerothcore/mod-autobalance.git|master|1d707cb61a0962ab01e4123681e2d3b66cc558a2||0|Scales creature health and damage with the group.
mod-ah-bot|azerothcore|Auction House Bot|https://github.com/azerothcore/mod-ah-bot.git|master|c11d8318cbd8714a9980f9464f78e07d3d48a70a||0|Public repository is azerothcore/mod-ah-bot. mod-ah-bot-plus is not a public repository.
